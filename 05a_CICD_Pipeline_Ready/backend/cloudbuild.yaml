steps:
  # Step 1: Run Automated Tests
  - name: 'python:3.10-slim'
    id: 'Test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "========================================="
        echo "🧪 Running Automated Tests..."
        echo "========================================="
        pip install --upgrade pip
        pip install -r backend/requirements.txt
        pytest backend/test_main.py -v

  # Step 2: Build Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${_ENV}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # Step 3: Push Docker Image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${_ENV}'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push-Latest'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:latest'

  # Step 4: Deploy to Google Cloud Run (Multi-Environment)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}-${_ENV}'
      - '--image'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${_ENV}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT_ID=${PROJECT_ID},GOOGLE_GENAI_USE_VERTEXAI=FALSE,GENMEDIA_BUCKET=${_BUCKET_NAME}'
      - '--set-secrets'
      - 'GOOGLE_API_KEY=${_SECRET_NAME}:latest'

images:
  - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${_ENV}'
  - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:latest'

substitutions:
  _ENV: 'staging'                    # Default environment (staging or production)
  _SERVICE_NAME: 'storygen-backend'  # Cloud Run service base name
  _REGION: 'us-central1'             # Cloud Run deployment region
  _BUCKET_NAME: 'storygen-workshop'  # Google Cloud Storage bucket name
  _SECRET_NAME: 'sdlcv3-api-secret'  # Secret name in Secret Manager for GOOGLE_API_KEY
